name: CI

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install validators and Slint build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            glslang-tools \
            libfontconfig1-dev \
            libxkbcommon-dev \
            libwayland-dev

      - name: Validate shader and Rust application
        run: make check

  arch-package:
    runs-on: ubuntu-latest
    container: archlinux:base-devel

    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm \
            git \
            glslang \
            cargo \
            cmake \
            ninja \
            fontconfig \
            libxkbcommon \
            wayland

      - uses: actions/checkout@v4

      - name: Validate
        run: make check

      - name: Build package
        run: |
          useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          runuser -u builder -- \
            "$GITHUB_WORKSPACE/scripts/build-arch-package.sh" \
            --noconfirm \
            --nodeps

      - name: Generate checksums
        run: |
          cd dist
          sha256sum *.pkg.tar.* > SHA256SUMS
          cat SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: arch-package
          path: |
            dist/*.pkg.tar.*
            dist/SHA256SUMS

  release:
    name: Create GitHub Release
    needs: arch-package

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Determine release tag
        id: meta
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
            if [[ -z "$VERSION" ]]; then
              echo "Could not read version from Cargo.toml" >&2
              exit 1
            fi
            TAG="v${VERSION}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Release tag: $TAG"

      - name: Check whether release tag already exists
        id: check
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          if [[ "$GITHUB_REF" == "refs/tags/$TAG" ]]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
          elif git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null 2>&1; then
            echo "Tag $TAG already exists; skipping release." >&2
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download Arch package
        if: steps.check.outputs.skip == 'false'
        uses: actions/download-artifact@v4
        with:
          name: arch-package
          path: dist

      - name: Create GitHub Release
        if: steps.check.outputs.skip == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Hyprland CRT Shader ${{ steps.meta.outputs.tag }}
          files: |
            dist/*.pkg.tar.*
            dist/SHA256SUMS
          generate_release_notes: true
