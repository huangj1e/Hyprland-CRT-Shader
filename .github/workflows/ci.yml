name: CI

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install validators and Slint build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            glslang-tools \
            libfontconfig1-dev \
            libxkbcommon-dev \
            libwayland-dev

      - name: Validate shader and Rust application
        run: make check

  arch-package:
    runs-on: ubuntu-latest
    container: archlinux:base-devel

    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm \
            git \
            glslang \
            cargo \
            cmake \
            ninja \
            fontconfig \
            libxkbcommon \
            wayland

      - uses: actions/checkout@v4

      - name: Validate
        run: make check

      - name: Build package
        run: |
          useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          runuser -u builder -- \
            "$GITHUB_WORKSPACE/scripts/build-arch-package.sh" \
            --noconfirm \
            --nodeps

      - name: Generate checksums
        run: |
          cd dist
          sha256sum *.pkg.tar.* > SHA256SUMS
          cat SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: arch-package
          path: |
            dist/*.pkg.tar.*
            dist/SHA256SUMS

  release:
    name: Create GitHub Release
    needs: arch-package
    if: startsWith(github.ref, 'refs/tags/v')

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download Arch package
        uses: actions/download-artifact@v4
        with:
          name: arch-package
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Hyprland CRT Shader ${{ github.ref_name }}
          files: |
            dist/*.pkg.tar.*
            dist/SHA256SUMS
          generate_release_notes: true
