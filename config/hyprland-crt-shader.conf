# Legacy Hyprland configuration example.
# Add this line to ~/.config/hypr/hyprland.conf with:
# source = /usr/share/hyprland-crt-shader/hyprland-crt-shader.conf

decoration {
    screen_shader = /usr/share/hyprland-crt-shader/crt.frag
}

# Required for time-driven animation while the desktop is otherwise idle.
debug {
    damage_tracking = 0
    vfr = false
}
